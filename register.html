<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản | ZORENB Luxury Showroom</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Inter:wght@400;500;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-page">
    <!-- Nút quay lại trang chủ -->
    <a href="index.html" class="back-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Quay lại trang chủ</span>
    </a>

    <div class="login-container">
        <!-- Logo & Thương hiệu -->
        <div class="login-brand animate-fade-in-down">
            <div class="logo-wrapper">
                <div class="logo-icon">Z</div>
            </div>
            <h1 class="brand-name">ZORENB</h1>
            <p class="brand-tagline">LUXURY SHOWROOM</p>
        </div>

        <!-- Form Đăng ký -->
        <div class="login-card glass-panel animate-fade-in-up">
            <h2 class="card-title">Đăng Ký Tài Khoản</h2>
            <p class="card-subtitle">Hãy gia nhập cộng đồng chủ sở hữu siêu xe đẳng cấp</p>

            <form id="registerForm" class="login-form">
                <div class="input-group">
                    <label for="fullname">Họ và tên</label>
                    <div class="input-wrapper">
                        <input type="text" id="fullname" placeholder="Nguyễn Văn A" required>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Địa chỉ Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="example@email.com" required>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="reg-username">Tên đăng nhập</label>
                    <div class="input-wrapper">
                        <input type="text" id="reg-username" placeholder="chon_ten_dang_nhap" required>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="reg-password">Mật khẩu</label>
                    <div class="input-wrapper">
                        <input type="password" id="reg-password" placeholder="••••••••" required>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Xác nhận mật khẩu</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm-password" placeholder="••••••••" required>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" required>
                        <span class="checkmark"></span>
                        Tôi đồng ý với các <a href="#" class="primary-gold">điều khoản dịch vụ</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-login-submit">
                    <span>Đăng Ký Ngay</span>
                    <div class="btn-shine"></div>
                </button>
            </form>

            <div class="login-footer">
                <p>Đã có tài khoản? <a href="login.html" class="register-link">Đăng nhập ngay</a></p>
            </div>
        </div>
    </div>

    <!-- Background Decorative Elements -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <!-- CUSTOM CURSOR ELEMENTS -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <script src="java/cursor.js"></script>
    <script src="java/login.js"></script> <!-- Reusing form submission animation logic -->
</body>

</html>
