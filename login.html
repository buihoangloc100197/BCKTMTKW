<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập | ZORENB Luxury Showroom</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Inter:wght@400;500;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css"> <!-- Reusing some global styles if any -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-page">
    <!-- Nút quay lại trang chủ -->
    <a href="index.html" class="back-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Quay lại trang chủ</span>
    </a>

    <div class="login-container">
        <!-- Logo & Thương hiệu -->
        <div class="login-brand animate-fade-in-down">
            <div class="logo-wrapper">
                <div class="logo-icon">Z</div>
            </div>
            <h1 class="brand-name">ZORENB</h1>
            <p class="brand-tagline">LUXURY SHOWROOM</p>
        </div>

        <!-- Form Đăng nhập -->
        <div class="login-card glass-panel animate-fade-in-up">
            <h2 class="card-title">Đăng Nhập Hệ Thống</h2>
            <p class="card-subtitle">Chào mừng quý khách trở lại với thế giới siêu xe</p>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="username">Tên đăng nhập hoặc Email</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="Nhập tên đăng nhập của bạn" required>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label for="password">Mật khẩu</label>
                        <a href="forgot-password.html" class="forgot-link">Quên mật khẩu?</a>
                    </div>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Ghi nhớ đăng nhập
                    </label>
                </div>

                <button type="submit" class="btn btn-login-submit">
                    <span>Đăng Nhập Ngay</span>
                    <div class="btn-shine"></div>
                </button>

                <div class="auth-divider">HOẶC ĐĂNG NHẬP BẰNG</div>

                <div class="social-login-group">
                    <button type="button" class="btn-social btn-google" id="googleSignInBtn">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-1 .67-2.28 1.07-3.71 1.07-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.11c-.22-.67-.35-1.39-.35-2.11s.13-1.44.35-2.11V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.83z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.83c.87-2.6 3.3-4.51 6.16-4.51z" fill="#EA4335"/>
                        </svg>
                        Tiếp tục với Google
                    </button>
                    <button type="button" class="btn-social btn-facebook">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" fill="#1877F2"/>
                        </svg>
                        Tiếp tục với Facebook
                    </button>
                </div>
            </form>

            <div class="login-footer">
                <p>Chưa có tài khoản? <a href="register.html" class="register-link">Đăng ký ngay</a></p>
            </div>
        </div>
    </div>

    <!-- Background Decorative Elements -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <!-- CUSTOM CURSOR ELEMENTS -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <script src="java/cursor.js"></script>
    <script src="java/login.js"></script>

    <script>
        // API Callback xử lý khi Google trả về dữ liệu (Google OAuth 2.0)
        function handleCredentialResponse(response) {
            // Giải mã JWT Token từ Google GSI
            const responsePayload = JSON.parse(atob(response.credential.split('.')[1]));
            
            // Lưu dữ liệu vào hệ thống web để làm tài khoản
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userName', responsePayload.name);
            localStorage.setItem('userEmail', responsePayload.email);
            localStorage.setItem('userAvatar', responsePayload.picture);
            
            window.location.href = 'index.html';
        }

        window.onload = function () {
            // Khởi tạo Google Identity Services
            if(window.google) {
                google.accounts.id.initialize({
                    client_id: "YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com", // Điền Client ID thật của bạn
                    callback: handleCredentialResponse
                });
                
                // Fallback mô phỏng nếu chưa cấu hình Client ID chạy server thật
                const btnGoogle = document.getElementById('googleSignInBtn');
                if (btnGoogle) {
                    btnGoogle.addEventListener('click', function(e) {
                        e.preventDefault();
                        
                        // Nếu thư viện Google chạy được thì nó sẽ gọi popup, 
                        // Nhưng ở máy trạm file:// thì chúng ta giả lập thông tin cho nhanh
                        localStorage.setItem('isLoggedIn', 'true');
                        localStorage.setItem('userName', 'Zorenb VIP');
                        localStorage.setItem('userEmail', 'client@google.com');
                        localStorage.setItem('userAvatar', 'https://ui-avatars.com/api/?name=Z+V&background=4285F4&color=fff&bold=true');
                        
                        // Chuyển hướng về trang chủ ngay lập tức
                        window.location.href = 'index.html';
                    });
                }
            }
        }
    </script>
</body>

</html>
