<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Mã | ZORENB Luxury Showroom</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Inter:wght@400;500;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
    
    <style>
        .otp-input-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 20px 0;
            direction: ltr;
        }
        .otp-input {
            width: calc(100% / 6 - 8px);
            aspect-ratio: 1/1;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-white);
            transition: var(--transition-smooth);
            outline: none;
        }
        .otp-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary-gold);
            box-shadow: 0 0 10px rgba(197, 160, 89, 0.2);
        }
        .otp-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.05);
        }
        /* Chrome, Safari, Edge, Opera */
        .otp-input::-webkit-outer-spin-button,
        .otp-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        /* Firefox */
        .otp-input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>

<body class="login-page">
    <!-- Nút quay lại trang trước -->
    <a href="forgot-password.html" class="back-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Quay lại</span>
    </a>

    <div class="login-container">
        <!-- Logo & Thương hiệu -->
        <div class="login-brand animate-fade-in-down">
            <div class="logo-wrapper">
                <div class="logo-icon">Z</div>
            </div>
            <h1 class="brand-name">ZORENB</h1>
            <p class="brand-tagline">LUXURY SHOWROOM</p>
        </div>

        <!-- Form Xác nhận -->
        <div class="login-card glass-panel animate-fade-in-up">
            <h2 class="card-title">Xác Nhận Mã</h2>
            <p class="card-subtitle">Vui lòng nhập mã bảo mật có 6 số đã được gửi đến bạn</p>

            <form id="verifyCodeForm" class="login-form">
                
                <div class="otp-input-container">
                    <input type="text" inputmode="numeric" pattern="[0-9]*" class="otp-input" maxlength="1" required>
                    <input type="text" inputmode="numeric" pattern="[0-9]*" class="otp-input" maxlength="1" required disabled>
                    <input type="text" inputmode="numeric" pattern="[0-9]*" class="otp-input" maxlength="1" required disabled>
                    <input type="text" inputmode="numeric" pattern="[0-9]*" class="otp-input" maxlength="1" required disabled>
                    <input type="text" inputmode="numeric" pattern="[0-9]*" class="otp-input" maxlength="1" required disabled>
                    <input type="text" inputmode="numeric" pattern="[0-9]*" class="otp-input" maxlength="1" required disabled>
                </div>

                <div style="text-align: center; margin-bottom: 20px; font-size: 13px;">
                    <span style="color: var(--text-gray);">Chưa nhận được mã?</span>
                    <a href="#" class="register-link" id="resendCode">Gửi lại mã (<span id="countdown">60</span>s)</a>
                </div>

                <!-- Thêm JS nội tuyến redirect để chạy demo flow nếu chưa có backend -->
                <button type="submit" class="btn btn-login-submit" onclick="event.preventDefault(); localStorage.setItem('isLoggedIn', 'true'); alert('Xác nhận thành công!'); window.location.href='index.html';">
                    <span>Xác Nhận & Tiếp Tục</span>
                    <div class="btn-shine"></div>
                </button>
            </form>
        </div>
    </div>

    <!-- Background Decorative Elements -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <!-- CUSTOM CURSOR ELEMENTS -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <script src="java/cursor.js"></script>
    <script src="java/login.js"></script>
    <script>
        // Logic xử lý nhập ô OTP mượt mà
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            // Chặn nhập phím không phải số
            input.addEventListener('keydown', (e) => {
                const isNumber = /^[0-9]$/.test(e.key);
                if (!isNumber && !['Backspace', 'ArrowLeft', 'ArrowRight', 'Tab', 'Delete'].includes(e.key) && !e.ctrlKey && !e.metaKey) {
                    e.preventDefault();
                }

                // Xử lý nút xóa Backspace tự động lui lại
                if (e.key === 'Backspace') {
                    if (e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = ''; // xóa ô trước để nhập mượt hơn
                    } else {
                        e.target.value = '';
                    }
                }
            });

            input.addEventListener('input', (e) => {
                // Lọc bỏ ký tự nếu lỡ dán vào (paste)
                e.target.value = e.target.value.replace(/[^0-9]/g, '');

                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                
                // Tự động chuyển qua ô tiếp theo
                if (e.target.value !== '' && index < inputs.length - 1) {
                    inputs[index + 1].disabled = false;
                    inputs[index + 1].focus();
                }
            });

            // Hỗ trợ tự động điền khi dán (Paste) mã 6 số
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '');
                if (!pastedData) return;
                
                let currIndex = index;
                for (let i = 0; i < pastedData.length && currIndex < inputs.length; i++) {
                    inputs[currIndex].disabled = false;
                    inputs[currIndex].value = pastedData[i];
                    currIndex++;
                }
                if (currIndex < inputs.length) {
                    inputs[currIndex].disabled = false;
                    inputs[currIndex].focus();
                } else {
                    inputs[inputs.length - 1].focus();
                }
            });
        });

        // Hẹn giờ đếm ngược cho vòng Gửi lại mã
        let timeLeft = 60;
        const countdownEl = document.getElementById('countdown');
        const resendLink = document.getElementById('resendCode');
        
        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) {
                countdownEl.textContent = timeLeft;
            } else {
                clearInterval(timer);
                resendLink.innerHTML = 'Gửi lại mã ngay';
                resendLink.style.cursor = 'pointer';
            }
        }, 1000);
        
        resendLink.addEventListener('click', (e) => {
             if (timeLeft > 0) e.preventDefault(); 
             else {
                 e.preventDefault();
                 timeLeft = 60;
                 resendLink.innerHTML = 'Gửi lại mã (<span id="countdown">60</span>s)';
                 // Khởi động lại timer
             }
        });
    </script>
</body>

</html>
