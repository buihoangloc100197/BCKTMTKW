<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZORENB - Showroom Siêu Xe Đẳng Cấp</title>

    <!-- Google Fonts: Roboto (Body), Inter (UI), Be Vietnam Pro (Headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Inter:wght@400;500;600&family=Roboto:wght@300;400;500&display=swap"
        rel="stylesheet">

    <!-- CSS Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <script src="java/i18n.js"></script>
    <script src="java/header.js"></script>
</head>

<body>
    <!-- CUSTOM CURSOR -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- HEADER -->
    <div id="global-header"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- Hero Section với Background Image Parallax -->
        <section class="hero img-bg" id="hero-slider">
            <!-- Lớp phủ bóng mờ để làm nổi bật chữ & thông số -->
            <div class="hero-overlay"></div>

            <!-- NÚT ĐIỀU HƯỚNG SLIDER (Luxury Design) -->
            <button class="nav-btn prev-btn" id="prev-car">&lt;&lt;</button>
            <button class="nav-btn next-btn" id="next-car">&gt;&gt;</button>

            <div class="hero-content fade-in-up">
                <h1 class="hero-title" id="car-title">Định Hình Phong Cách. Xứng Tầm Đẳng Cấp</h1>
                <p class="hero-subtitle" id="car-subtitle">Khám phá bộ sưu tập siêu xe giới hạn độc quyền và trải nghiệm
                    dịch vụ cá nhân hóa đỉnh cao chỉ có tại ZORENB</p>

                <!-- GLASSMORPHISM TECH SPECS CARD -->
                <div class="tech-specs">
                    <div class="spec-item">
                        <span class="spec-value" id="spec-accel">2.8s</span>
                        <span class="spec-label">0-100 km/h</span>
                    </div>
                    <div class="spec-divider"></div>
                    <div class="spec-item">
                        <span class="spec-value" id="spec-speed">350</span>
                        <span class="spec-label">Top Speed (km/h)</span>
                    </div>
                    <div class="spec-divider"></div>
                    <div class="spec-item">
                        <span class="spec-value" id="spec-engine">V12</span>
                        <span class="spec-label">Twin-Turbo Engine</span>
                    </div>
                </div>

                <div class="hero-cta">
                    <button class="btn btn-primary magnetic-btn" data-i18n="btn_explore" onclick="window.location.href='lamborghini.html'">Khám Phá Bộ Sưu Tập</button>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="main-footer fade-in">
        <p data-i18n="footer_copyright">&copy; 2026 ZORENB Luxury Showroom. Đã đăng ký bản quyền toàn cầu.</p>
    </footer>

    <!-- NÚT CSKH (Jumping Support Button) -->
    <a href="tel:18001909" class="cskh-wrapper bounce-luxury">
        <div class="cskh-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                </path>
            </svg>
        </div>
        <div class="cskh-text">
            <span data-i18n="cskh_label">CSKH:</span>
            <strong>18001909</strong>
        </div>
    </a>

    <!-- JavaScript - Nằm trong thư mục java mà bạn đã yêu cầu tạo -->
    <script src="java/main.js"></script>
</body>

</html>
