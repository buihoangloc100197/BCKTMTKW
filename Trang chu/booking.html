<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Lái Thử - ZORENB Luxury Showroom</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- CSS Styles -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/booking.css">

    <!-- Language & Header Data -->
    <script src="../java/data.js"></script>
    <script src="../java/i18n.js"></script>
</head>
<body class="booking-body">
    <!-- BACKGROUND LAYERS -->
    <div class="booking-bg-layer" id="page-bg"></div>
    <div class="booking-overlay"></div>

    <!-- BACK BUTTON -->
    <a href="javascript:history.back()" class="btn-back-booking">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>QUAY LẠI</span>
    </a>

    <!-- FORM CONTAINER -->
    <div class="booking-container" id="form-container">
        <div class="booking-header">
            <h2 id="page-title">ĐĂNG KÝ LÁI THỬ</h2>
            <p id="page-subtitle">Trải nghiệm cảm xúc thuần túy cùng <span id="car-display-name" class="text-gold">...</span></p>
        </div>

        <form id="booking-form" class="form-grid">
            <div class="form-group">
                <label>Họ và tên của quý khách</label>
                <input type="text" id="full-name" class="form-input" placeholder="Ví dụ: Nguyễn Văn A" required>
            </div>
            <div class="form-group">
                <label>Số điện thoại liên hệ</label>
                <input type="tel" id="phone" class="form-input" placeholder="Ví dụ: 0988xxxxxx" required>
            </div>
            <div class="form-group">
                <label>Địa chỉ Email</label>
                <input type="email" id="email" class="form-input" placeholder="Ví dụ: name@email.com" required>
            </div>
            <div class="form-group">
                <label>Ngày hẹn dự kiến</label>
                <input type="date" id="date" class="form-input" required>
            </div>
            <div class="form-group full-width">
                <label>Ghi chú thêm cho chuyên viên</label>
                <textarea id="notes" class="form-input" rows="3" placeholder="Quý khách có yêu cầu đặc biệt nào không?"></textarea>
            </div>
            <div class="form-group full-width">
                <button type="submit" class="btn-submit-booking" id="btn-submit">XÁC NHẬN ĐĂNG KÝ</button>
            </div>
        </form>

        <!-- SUCCESS MESSAGE (Hidden by default) -->
        <div id="success-state" style="display: none; text-align: center; padding: 2rem 0;">
            <div class="success-icon" style="font-size: 4rem; color: var(--color-accent-gold); margin-bottom: 2rem;">✓</div>
            <h2 style="color: var(--color-accent-gold); letter-spacing: 5px; margin-bottom: 1rem;">YÊU CẦU THÀNH CÔNG</h2>
            <p style="color: var(--color-text-secondary); line-height: 1.8;">Cảm ơn quý khách. Chuyên viên tư vấn VIP của ZORENB sẽ liên hệ xác nhận lịch hẹn trong vòng 15 phút qua số điện thoại này.</p>
            <button class="btn-submit-booking" style="margin-top: 2.5rem;" onclick="window.location.href='index.html'">VỀ TRANG CHỦ</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../java/booking.js"></script>
</body>
</html>
