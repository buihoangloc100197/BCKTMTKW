<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu | ZORENB Luxury Showroom</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Inter:wght@400;500;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body class="login-page">
    <!-- Nút quay lại login -->
    <a href="login.html" class="back-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Quay lại Đăng nhập</span>
    </a>

    <div class="login-container">
        <!-- Logo & Thương hiệu -->
        <div class="login-brand animate-fade-in-down">
            <div class="logo-wrapper">
                <div class="logo-icon">Z</div>
            </div>
            <h1 class="brand-name">ZORENB</h1>
            <p class="brand-tagline">LUXURY SHOWROOM</p>
        </div>

        <!-- Form Quên mật khẩu -->
        <div class="login-card glass-panel animate-fade-in-up">
            <h2 class="card-title">Quên Mật Khẩu?</h2>

            <form id="forgotPasswordForm" class="login-form" action="verify-code.html">
                
                <!-- Lựa chọn Email -->
                <div class="input-group" style="gap: 15px; margin-bottom: 15px;">
                    <label class="remember-me" style="font-size: 14px; color: var(--text-gray);">
                        <input type="radio" name="recoveryMethod" value="email" checked onclick="document.getElementById('recovery-phone').disabled=true; document.getElementById('recovery-email').disabled=false;">
                        <span class="checkmark"></span>
                        Nhập email của bạn, chúng tôi sẽ gửi liên kết khôi phục
                    </label>
                    <div class="input-wrapper">
                        <input type="email" id="recovery-email" placeholder="example@email.com" required>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <!-- Lựa chọn Số điện thoại -->
                <div class="input-group" style="gap: 15px;">
                    <label class="remember-me" style="font-size: 14px; color: var(--text-gray);">
                        <input type="radio" name="recoveryMethod" value="phone" onclick="document.getElementById('recovery-email').disabled=true; document.getElementById('recovery-phone').disabled=false;">
                        <span class="checkmark"></span>
                        Hoặc nhận mã khôi phục qua số điện thoại
                    </label>
                    <div class="input-wrapper">
                        <input type="tel" id="recovery-phone" placeholder="0912345678" disabled>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <button type="submit" class="btn btn-login-submit" style="margin-top: 15px;">
                    <span>Gửi Yêu Cầu Khôi Phục</span>
                    <div class="btn-shine"></div>
                </button>
            </form>

            <div class="login-footer">
                <p>Nhớ lại mật khẩu? <a href="login.html" class="register-link">Quay lại đăng nhập</a></p>
            </div>
        </div>
    </div>

    <!-- Background Decorative Elements -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <!-- CUSTOM CURSOR ELEMENTS -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <script src="../java/cursor.js"></script>
    <script src="../java/login.js"></script>
</body>

</html>
